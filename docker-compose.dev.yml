# ==============================================================
# docker-compose.dev.yml — Star Light Path (Development Overrides)
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# ==============================================================

version: "3.9"

services:

  # ── PostgreSQL (dev: expose port for local tools like DBeaver) ──
  db:
    ports:
      - "5432:5432"

  # ── Redis (dev: expose port for local inspection) ────────────
  redis:
    ports:
      - "6379:6379"

  # ── Django Backend (dev: hot-reload via volume mount) ────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime   # Use same image but...
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      # Hot-reload: mount source code
      - ./backend:/app
      # Persist media and static between restarts
      - media_files:/app/media
      - static_files:/app/staticfiles
    environment:
      DEBUG: "True"
      SECRET_KEY: "dev-insecure-key-change-in-production"
      ALLOWED_HOSTS: "localhost,127.0.0.1,backend"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
      CSRF_COOKIE_SECURE: "False"
      SESSION_COOKIE_SECURE: "False"
      EMAIL_BACKEND: "django.core.mail.backends.console.EmailBackend"
    ports:
      - "8000:8000"

  # ── Next.js Frontend (dev: hot-reload) ───────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev   # Use a dev-specific Dockerfile
    command: npm run dev
    volumes:
      # Hot-reload: mount source code
      - ./frontend:/app
      # Exclude node_modules (use container's version)
      - /app/node_modules
      - /app/.next
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: "http://localhost:8000"
      WATCHPACK_POLLING: "true"   # Required for hot-reload in Docker on Windows/Mac
    ports:
      - "3000:3000"

  # ── Nginx (dev: just pass-through, no SSL) ───────────────────
  nginx:
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
